name: CYDLE CI

on:
  push:
    branches: [development/codex]
  pull_request:
    branches: [development/codex]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows-checks:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install legacy reference dependencies
        run: npm ci

      - name: Typecheck legacy reference
        run: npm run typecheck

      - name: Test legacy reference
        run: npm test -- --run

      - name: Validate legacy catalogs
        run: npm run validate

      - name: Build legacy reference
        run: npm run build

      - name: Set up Godot 4.7.2 and Windows export templates
        uses: chickensoft-games/setup-godot@ac93246ea68518a384c1c280a496e5989341f2f6
        with:
          version: 4.7.2
          use-dotnet: false
          include-templates: true

      - name: Import native project
        run: godot --headless --path game --editor --quit

      - name: Run native headless tests
        run: godot --headless --path game --script res://tests/run_tests.gd

      - name: Validate asset manifest
        run: godot --headless --path game --script res://tools/validate_assets.gd

      - name: Export Windows release
        run: godot --headless --path game --export-release "Windows Desktop" build/CYDLE.exe

      - name: Upload Windows release artifact
        uses: actions/upload-artifact@v4
        with:
          name: cydle-windows-${{ github.sha }}
          path: game/build/CYDLE.exe
          if-no-files-found: error
          retention-days: 14
